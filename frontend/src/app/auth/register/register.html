<main class="min-h-screen bg-slate-100 px-4 py-10 sm:px-6 lg:py-16">
  <section class="mx-auto w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <header class="mb-6">
      <div class="mb-4 inline-flex h-11 w-11 items-center justify-center rounded-xl bg-blue-600 text-lg font-semibold text-white">
        A
      </div>

      <h1 class="text-2xl font-semibold text-slate-900">
        Crear cuenta
      </h1>

      <p class="mt-1 text-sm text-slate-600">
        Completa los datos para registrar un usuario.
      </p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="loading ? 'true' : 'false'" class="space-y-5">
      <div
        *ngIf="errorMessage"
        role="alert"
        aria-live="assertive"
        class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
      >
        {{ errorMessage }}
      </div>

      <div>
        <label for="name" class="mb-2 block text-sm font-medium text-slate-700">
          Nombre completo
        </label>

        <input
          id="name"
          type="text"
          formControlName="name"
          [attr.aria-invalid]="form.controls.name.touched && form.controls.name.invalid"
          placeholder="Juan Perez"
          class="h-11 w-full rounded-xl border border-slate-300 px-3 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />

        <p
          *ngIf="form.controls.name.touched && form.controls.name.invalid"
          class="mt-2 text-xs text-red-600"
        >
          El nombre debe tener minimo 3 caracteres.
        </p>
      </div>

      <div>
        <label for="email" class="mb-2 block text-sm font-medium text-slate-700">
          Correo
        </label>

        <input
          id="email"
          type="email"
          formControlName="email"
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
          placeholder="nombre@empresa.com"
          class="h-11 w-full rounded-xl border border-slate-300 px-3 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />

        <p
          *ngIf="form.controls.email.touched && form.controls.email.invalid"
          class="mt-2 text-xs text-red-600"
        >
          Ingresa un correo valido.
        </p>
      </div>

      <div>
        <label for="password" class="mb-2 block text-sm font-medium text-slate-700">
          Contrasena
        </label>

        <input
          id="password"
          type="password"
          formControlName="password"
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
          placeholder="Minimo 8, mayuscula, minuscula, numero y simbolo"
          class="h-11 w-full rounded-xl border border-slate-300 px-3 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />

        <p
          *ngIf="form.controls.password.touched && form.controls.password.invalid"
          class="mt-2 text-xs text-red-600"
        >
          {{ passwordPolicyMessage }}
        </p>
      </div>

      <button
        type="submit"
        [disabled]="loading"
        class="h-11 w-full rounded-xl bg-blue-600 px-4 text-sm font-medium text-white transition hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-70"
      >
        {{ loading ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>

    <p class="mt-6 text-sm text-slate-600">
      Ya tienes cuenta?
      <a routerLink="/login" class="font-medium text-blue-600 hover:text-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2">
        Inicia sesion
      </a>
    </p>
  </section>
</main>
