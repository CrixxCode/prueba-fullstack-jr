<section class="flex min-h-screen items-center justify-center bg-slate-100 px-4 py-10">
  <article class="w-full max-w-xl rounded-3xl border border-slate-200 bg-white p-8 text-center shadow-sm">
    <p class="text-sm font-semibold uppercase tracking-[0.25em] text-red-600">
      Error 403
    </p>

    <h1 class="mt-4 text-3xl font-bold text-slate-950">
      Acceso denegado
    </h1>

    <p class="mt-3 text-sm text-slate-600">
      No tienes permisos para ver esta seccion.
    </p>

    <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row">
      <a
        routerLink="/profile"
        class="inline-flex h-11 items-center justify-center rounded-xl bg-slate-900 px-5 text-sm font-semibold text-white transition hover:bg-slate-800 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-500 focus-visible:ring-offset-2"
      >
        Ir a mi perfil
      </a>

      <button
        type="button"
        (click)="goBack()"
        class="inline-flex h-11 items-center justify-center rounded-xl border border-slate-300 bg-white px-5 text-sm font-semibold text-slate-700 transition hover:bg-slate-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-slate-500 focus-visible:ring-offset-2"
      >
        Volver atras
      </button>
    </div>
  </article>
</section>
