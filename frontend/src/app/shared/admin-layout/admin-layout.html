<div class="min-h-screen bg-[#f4f7fb] text-slate-900">
  <aside class="fixed left-0 top-0 z-30 hidden h-screen w-72 border-r border-slate-200 bg-white lg:flex lg:flex-col">
    <div class="flex h-20 items-center gap-3 px-7">
      <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-600 text-white shadow-sm">
        <span class="text-xl font-bold">A</span>
      </div>

      <div>
        <h1 class="text-xl font-bold text-blue-700">UserAdmin</h1>
        <p class="text-xs font-medium text-slate-500">Management Platform</p>
      </div>
    </div>

    <nav class="mt-6 flex flex-1 flex-col gap-2 px-3">
      <a
        routerLink="/profile"
        routerLinkActive="bg-blue-50 text-blue-700"
        class="flex items-center gap-3 rounded-xl px-5 py-3 text-sm font-medium text-slate-600 transition hover:bg-blue-50 hover:text-blue-700"
      >
        <i class="fa-regular fa-id-badge w-4 text-center"></i>
        Mi perfil
      </a>

      <a
        *ngIf="user?.role === 'admin'"
        routerLink="/users"
        routerLinkActive="bg-blue-50 text-blue-700"
        class="flex items-center gap-3 rounded-xl px-5 py-3 text-sm font-medium text-slate-600 transition hover:bg-blue-50 hover:text-blue-700"
      >
        <i class="fa-solid fa-users w-4 text-center"></i>
        Usuarios
      </a>
    </nav>

    <div class="border-t border-slate-200 p-5">
      <button
        *ngIf="user?.role === 'admin'"
        type="button"
        (click)="goToCreateUser()"
        class="mb-5 flex w-full items-center justify-center gap-2 rounded-xl bg-blue-600 px-4 py-3 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700"
      >
        <i class="fa-solid fa-plus"></i>
        Crear usuario
      </button>

      <button
        type="button"
        (click)="logout()"
        class="flex w-full items-center justify-center gap-3 rounded-xl bg-red-600 px-4 py-3 text-center text-sm font-medium text-white transition hover:bg-red-700"
      >
        <i class="fa-solid fa-right-from-bracket"></i>
        Cerrar sesion
      </button>
    </div>
  </aside>

  <main class="lg:pl-72">
    <header class="sticky top-0 z-20 flex h-20 items-center justify-between border-b border-slate-200 bg-white/90 px-5 backdrop-blur lg:px-8">
      <div>
        <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-400">
          Panel
        </p>

        <h2 class="text-xl font-bold text-slate-950">
          {{ user?.role === 'admin' ? 'Admin Panel' : 'User Panel' }}
        </h2>
      </div>

      <div class="flex items-center gap-4">
        <div class="flex items-center gap-3 border-l border-slate-200 pl-4">
          <div class="flex h-10 w-10 items-center justify-center rounded-full bg-blue-100 text-sm font-bold text-blue-700">
            {{ user?.name?.charAt(0) || 'U' }}
          </div>

          <div class="hidden md:block">
            <p class="text-sm font-semibold text-slate-900">
              {{ user?.name }}
            </p>

            <p class="text-xs text-slate-500">
              {{ user?.role }}
            </p>
          </div>
        </div>
      </div>
    </header>

    <section class="p-5 lg:p-8">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
